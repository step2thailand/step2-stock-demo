
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Step2Thailand Stock</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #f5f7fa; color: #25334a;
      font-family: Arial, Tahoma, sans-serif;
    }
    header {
      background: white; padding: 20px 5%;
      border-bottom: 1px solid #e5eaf0;
    }
    header h1 { margin: 0; font-size: 23px; }
    header p { margin: 7px 0 0; color: #68778b; font-size: 13px; }
    main { max-width: 1100px; margin: auto; padding: 24px 16px; }
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .card, .panel {
      background: white; border: 1px solid #e5eaf0;
      border-radius: 12px; padding: 18px;
    }
    .label { color: #68778b; font-size: 13px; }
    .number { font-size: 28px; font-weight: bold; margin-top: 8px; }
    .panel { margin-top: 18px; }
    .toolbar {
      display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0;
    }
    input, select {
      padding: 11px; border: 1px solid #ccd5e0;
      border-radius: 8px; font-size: 14px; background: white;
    }
    input { flex: 1; min-width: 200px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; white-space: nowrap; }
    th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid #edf0f4; }
    th { color: #68778b; font-size: 12px; }
    td { font-size: 13px; }
    .status { margin-top: 12px; font-size: 13px; color: #68778b; }
    .error { color: #b42318; }
    @media(max-width: 600px) {
      .cards { grid-template-columns: 1fr; }
      header h1 { font-size: 20px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Step2Thailand Stock</h1>
    <p>ระบบจัดการคลังสินค้า · Demo Version</p>
  </header>

  <main>
    <div class="cards">
      <div class="card">
        <div class="label">จำนวน SKU</div>
        <div class="number" id="skuCount">—</div>
      </div>
      <div class="card">
        <div class="label">จำนวนสินค้าคงเหลือรวม</div>
        <div class="number" id="stockCount">—</div>
      </div>
      <div class="card">
        <div class="label">ตำแหน่งจัดเก็บ</div>
        <div class="number" id="locationCount">—</div>
      </div>
    </div>

    <section class="panel">
      <h2 style="font-size:18px;margin-top:0">ค้นหาสินค้า</h2>
      <div class="toolbar">
        <input id="search" placeholder="ค้นหา SKU, ชื่อสินค้า หรือ Barcode">
        <select id="floor">
          <option value="">ทุกชั้น</option>
          <option value="1">ชั้น 1</option>
          <option value="2">ชั้น 2</option>
        </select>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>SKU</th>
              <th>ชื่อสินค้า</th>
              <th>ตำแหน่ง</th>
              <th>ชั้น</th>
              <th>คงเหลือ</th>
            </tr>
          </thead>
          <tbody id="products">
            <tr><td colspan="5">กำลังโหลดข้อมูล...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="status" id="status">รอการเชื่อมต่อฐานข้อมูล</div>
    </section>
  </main>

  <script>
    // ใส่ค่าจาก Supabase Project Settings > API
    const SUPABASE_URL = "https://btggzmfvubvizrgfbckp.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_AAm89Ef-82pkqJJGmC3t4A_83S7c7sF";

    const tbody = document.getElementById("products");
    const statusBox = document.getElementById("status");
    let rows = [];

    function showMessage(message, error = false) {
      statusBox.textContent = message;
      statusBox.className = error ? "status error" : "status";
    }

    function render() {
      const term = document.getElementById("search").value.trim().toLowerCase();
      const floor = document.getElementById("floor").value;

      const filtered = rows.filter(r =>
        (!term ||
          r.sku.toLowerCase().includes(term) ||
          r.product_name.toLowerCase().includes(term) ||
          (r.barcode || "").includes(term)) &&
        (!floor || String(r.floor_no) === floor)
      );

      tbody.replaceChildren();

      if (!filtered.length) {
        const tr = tbody.insertRow();
        const td = tr.insertCell();
        td.colSpan = 5;
        td.textContent = "ไม่พบสินค้า";
        return;
      }

      filtered.forEach(r => {
        const tr = tbody.insertRow();
        [r.sku, r.product_name, r.location_code,
         "ชั้น " + r.floor_no, r.quantity.toLocaleString("th-TH")]
          .forEach(value => {
            const td = tr.insertCell();
            td.textContent = value;
          });
      });
    }

    async function loadData() {
      try {
        if (SUPABASE_URL.startsWith("ใส่_") ||
            SUPABASE_ANON_KEY.startsWith("ใส่_")) {
          throw new Error("ยังไม่ได้ตั้งค่า Supabase URL และ Publishable Key");
        }

        const db = window.supabase.createClient(
          SUPABASE_URL, SUPABASE_ANON_KEY
        );

        const [p, l, b] = await Promise.all([
          db.from("products")
            .select("id, sku, product_name, barcode")
            .eq("is_active", true)
            .order("sku"),
          db.from("locations")
            .select("id, location_code, floor_no")
            .eq("is_active", true),
          db.from("stock_balances")
            .select("product_id, location_id, quantity")
        ]);

        if (p.error) throw p.error;
        if (l.error) throw l.error;
        if (b.error) throw b.error;

        const productMap = new Map(p.data.map(x => [x.id, x]));
        const locationMap = new Map(l.data.map(x => [x.id, x]));

        rows = b.data.map(x => {
          const product = productMap.get(x.product_id);
          const location = locationMap.get(x.location_id);
          if (!product || !location) return null;

          return {
            ...product,
            location_code: location.location_code,
            floor_no: location.floor_no,
            quantity: x.quantity
          };
        }).filter(Boolean);

        document.getElementById("skuCount").textContent = p.data.length;
        document.getElementById("stockCount").textContent =
          b.data.reduce((sum, x) => sum + x.quantity, 0).toLocaleString("th-TH");
        document.getElementById("locationCount").textContent = l.data.length;

        render();
        showMessage("เชื่อมต่อฐานข้อมูลสำเร็จ");
      } catch (err) {
        showMessage("โหลดข้อมูลไม่สำเร็จ: " + err.message, true);
        tbody.replaceChildren();
        const tr = tbody.insertRow();
        const td = tr.insertCell();
        td.colSpan = 5;
        td.textContent = "กรุณาตรวจสอบการตั้งค่าฐานข้อมูล";
      }
    }

    document.getElementById("search").addEventListener("input", render);
    document.getElementById("floor").addEventListener("change", render);
    loadData();
  </script>
</body>
</html>
